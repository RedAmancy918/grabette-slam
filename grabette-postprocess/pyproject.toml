[project]
name = "grabette-postprocess"
version = "0.1.0"
description = "Post-processing for GRABETTE: SLAM orchestration and LeRobot dataset generation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "av",
    "click",
    "pandas",
    "tqdm",
    "lerobot>=0.6.1,<0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
