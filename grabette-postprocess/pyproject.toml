[project]
name = "grabette-postprocess"
version = "0.1.0"
description = "Post-processing for GRABETTE: SLAM orchestration and LeRobot dataset generation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "av",
    "click",
    "pandas",
    "tqdm",
    # [dataset] pulls the HF `datasets` lib that LeRobot needs to build/push a
    # dataset — it's an optional extra in lerobot>=0.5, not a core dep, so the
    # bare requirement silently dropped it on an unpinned rebuild.
    "lerobot[dataset]>=0.5.0 ; python_version >= '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
