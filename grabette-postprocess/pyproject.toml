[project]
name = "grabette-postprocess"
version = "0.1.0"
description = "Post-processing for GRABETTE: SLAM orchestration and LeRobot dataset generation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "av",
    "click",
    "pandas",
    "tqdm",
    # Pinned: the build path relies on LeRobotDataset.create(streaming_encoding=).
    # 0.6.1 fixes uint8 overflow in streaming image statistics.
    "lerobot==0.6.1 ; python_version >= '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
